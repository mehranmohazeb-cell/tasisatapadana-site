name = "tasisatapadana"
main = "src/index.js"
compatibility_date = "2024-11-01"

# سرو فایل‌های استاتیک از پوشه public
# مستندات: https://developers.cloudflare.com/workers/static-assets/
[assets]
directory = "./public"
binding = "ASSETS"
# اتصال دیتابیس Cloudflare D1
[[d1_databases]]
binding = "DB"
database_name = "tasisatapadana-db"
database_id = "0088ce29-aea2-410b-8949-10917e101e78"

# فضای موقت (KV) فقط برای شمارش «در حال مشاهده» هر محصول.
# این namespace با D1 هیچ ارتباطی ندارد و اطلاعات آن کاملاً موقت
# است (هر کلید با expirationTtl خودش پاک می‌شود)، پس هیچ فشاری
# روی D1 (محصولات/سفارش‌ها/کاربران) وارد نمی‌کند.
#
# راه‌اندازی (فقط یک‌بار، قبل از دیپلوی):
#   npx wrangler kv namespace create VIEWERS_KV
# سپس مقدار id چاپ‌شده در ترمینال را جای‌گزین "REPLACE_WITH_KV_NAMESPACE_ID" کن.
# اگر این namespace ساخته/متصل نشود، سایت همچنان کامل کار می‌کند و
# فقط بخش «تعداد بازدیدکننده» روی صفحه محصول نمایش داده نمی‌شود.
[[kv_namespaces]]
binding = "VIEWERS_KV"
id = "cd14930538bf40cc8eb8e3d95ce00fc4"

