<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>سبد خرید | تأسیسات آپادانا</title>
  <link rel="stylesheet" href="store.css">
</head>

<body>

<header class="store-header">
  <div class="container">
    <a href="index.html" class="logo-link">
      <img src="../assets/logo-header.png" alt="تأسیسات آپادانا">
    </a>

    <nav class="store-nav">
      <a href="index.html">فروشگاه</a>
      <a href="cart.html" class="nav-cart-link">
        <svg class="nav-icon" viewBox="0 0 24 24" aria-hidden="true" focusable="false"><path fill="currentColor" d="M7 18c-1.1 0-1.99.9-1.99 2S5.9 22 7 22s2-.9 2-2-.9-2-2-2zM1 2v2h2l3.6 7.59-1.35 2.44C4.52 14.37 5 16 6 16h12v-2H6.42c-.14 0-.25-.11-.25-.25l.03-.12L7.1 12h7.45c.75 0 1.41-.41 1.75-1.03l3.58-6.49c.08-.14.12-.31.12-.48 0-.55-.45-1-1-1H5.21l-.94-2H1zm16 18c-1.1 0-1.99.9-1.99 2s.89 2 1.99 2 2-.9 2-2-.9-2-2-2z"/></svg>
        سبد خرید
        <span id="cart-count">0</span>
      </a>
      <a href="track-order.html">پیگیری سفارش</a>
      <a href="account.html" class="nav-account-link">
        <svg class="nav-icon" viewBox="0 0 24 24" aria-hidden="true" focusable="false"><path fill="currentColor" d="M12 12c2.21 0 4-1.79 4-4s-1.79-4-4-4-4 1.79-4 4 1.79 4 4 4zm0 2c-2.67 0-8 1.34-8 4v2h16v-2c0-2.66-5.33-4-8-4z"/></svg>
        حساب کاربری
      </a>
      <a href="../support.html">پشتیبانی</a>
    </nav>
  </div>
</header>

<main class="container cart-page">

  <section class="cart-hero">
    <h1>سبد خرید</h1>
    <p>محصولات انتخاب‌شده خود را بررسی کنید.</p>
  </section>

  <section id="cart-content">
    <p class="loading">در حال بارگذاری سبد خرید...</p>
  </section>

</main>

<footer class="store-footer">
  <div class="container">
    <p>© تأسیسات آپادانا - تمامی حقوق محفوظ است.</p>
  </div>
</footer>

<script>
function getCart() {
  try {
    return JSON.parse(localStorage.getItem("tasisat_apadana_cart")) || [];
  } catch {
    return [];
  }
}

function saveCart(cart) {
  localStorage.setItem(
    "tasisat_apadana_cart",
    JSON.stringify(cart)
  );

  updateCartCount();
  renderCart();
}

function updateCartCount() {
  const element = document.getElementById("cart-count");

  if (!element) return;

  element.textContent = getCart()
    .reduce((total, item) => total + Number(item.quantity || 0), 0)
    .toLocaleString("fa-IR");
}

function formatPrice(price) {
  if (price === null || price === undefined || price === "") {
    return "تماس بگیرید";
  }

  const number = Number(price);

  return Number.isNaN(number)
    ? String(price)
    : `${number.toLocaleString("fa-IR")} تومان`;
}

function escapeHtml(value) {
  return String(value ?? "")
    .replaceAll("&", "&amp;")
    .replaceAll("<", "&lt;")
    .replaceAll(">", "&gt;")
    .replaceAll('"', "&quot;")
    .replaceAll("'", "&#039;");
}

/* =========================================================
   مسیر صحیح تصویر محصول — دقیقاً همان منطق صفحه جزئیات محصول و
   فروشگاه (getProductImageUrl در product.html و store.js). این تابع
   اینجا هم لازم است چون آیتم‌های قدیمی سبد خرید ممکن است قبل از رفع
   باگ، با یک مسیر خام/نسبی یا بدون تصویر ذخیره شده باشند؛ با عبور از
   همین تابع در لحظه نمایش، بدون نیاز به تغییر localStorage، تصویر
   صحیح (یا placeholder امن) نشان داده می‌شود.
   ========================================================= */

function getProductImageUrl(image) {
  if (!image) {
    return "/assets/products/placeholder.svg";
  }

  const value = String(image).trim();

  if (
    value.startsWith("http://") ||
    value.startsWith("https://") ||
    value.startsWith("data:")
  ) {
    return value;
  }

  if (value.startsWith("/")) {
    return value;
  }

  if (value.startsWith("assets/")) {
    return "/" + value;
  }

  if (value.startsWith("products/")) {
    return "/assets/" + value;
  }

  return "/assets/products/" + value;
}

function changeQuantity(index, change) {
  const cart = getCart();

  if (!cart[index]) return;

  cart[index].quantity =
    Number(cart[index].quantity || 1) + change;

  if (cart[index].quantity <= 0) {
    cart.splice(index, 1);
  }

  saveCart(cart);
}

function removeItem(index) {
  const cart = getCart();

  if (!cart[index]) return;

  cart.splice(index, 1);
  saveCart(cart);
}

function renderCart() {
  const container = document.getElementById("cart-content");
  const cart = getCart();

  if (cart.length === 0) {
    container.innerHTML = `
      <div class="cart-empty">
        <div class="cart-empty-icon">🛒</div>
        <h2>سبد خرید شما خالی است</h2>
        <p>هنوز محصولی به سبد خرید اضافه نکرده‌اید.</p>
        <a href="index.html" class="product-button cart-shop-button">
          رفتن به فروشگاه
        </a>
      </div>
    `;

    return;
  }

  let total = 0;

  const itemsHtml = cart.map((item, index) => {

    const price = Number(item.price) || 0;
    const quantity = Number(item.quantity) || 1;

    total += price * quantity;

    return `
      <article class="cart-item">

        <img
          src="${escapeHtml(getProductImageUrl(item.image))}"
          alt="${escapeHtml(item.name)}"
          class="cart-item-image"
        >

        <div class="cart-item-info">

          <h3>${escapeHtml(item.name)}</h3>

          <div class="cart-item-price">
            ${formatPrice(item.price)}
          </div>

          <div class="cart-item-controls">

            <div class="quantity-control">
              <button
                type="button"
                onclick="changeQuantity(${index}, 1)"
                aria-label="افزایش تعداد"
              >+</button>

              <span>
                ${quantity.toLocaleString("fa-IR")}
              </span>

              <button
                type="button"
                onclick="changeQuantity(${index}, -1)"
                aria-label="کاهش تعداد"
              >−</button>
            </div>

            <button
              type="button"
              class="remove-item"
              onclick="removeItem(${index})"
            >
              حذف
            </button>

          </div>

        </div>

      </article>
    `;

  }).join("");

  container.innerHTML = `

    <div class="cart-list">
      ${itemsHtml}
    </div>

    <div class="cart-summary">

      <div class="cart-total">
        <span>مبلغ کل</span>
        <strong>${formatPrice(total)}</strong>
      </div>

      <a
        href="checkout.html"
        class="product-button cart-checkout-button"
      >
        ادامه و ثبت سفارش
      </a>

    </div>

  `;
}

document.addEventListener("DOMContentLoaded", () => {
  updateCartCount();
  renderCart();
});
</script>

</body>
</html>
