<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>سبد خرید | تأسیسات آپادانا</title><link rel="stylesheet" href="store.css"><link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin><link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Vazirmatn:wght@400;500;700;900&display=swap"></head>
<body>
<header class="store-header"><div class="container"><a href="index.html" class="logo-link"><img src="../assets/logo-header.png" alt="تأسیسات آپادانا"></a><nav class="store-nav"><a href="index.html">فروشگاه</a><a href="cart.html">سبد خرید <span id="cart-count">0</span></a></nav></div></header>
<main class="container cart-page"><section class="store-hero"><h1>سبد خرید</h1><div id="cart-content"><p class="loading">در حال بارگذاری سبد خرید...</p></div></section></main>
<footer class="store-footer"><div class="container"><p>© تأسیسات آپادانا - تمامی حقوق محفوظ است.</p></div></footer>
<script>
const CART_KEY="tasisat_apadana_cart_v2";
function getCart(){try{const v=JSON.parse(localStorage.getItem(CART_KEY)||"[]");return Array.isArray(v)?v:[]}catch{return[]}}
function saveCart(cart){localStorage.setItem(CART_KEY,JSON.stringify(cart));updateCartCount();renderCart();}
function updateCartCount(){const e=document.getElementById("cart-count");if(e)e.textContent=getCart().reduce((t,i)=>t+Number(i.quantity||0),0).toLocaleString("fa-IR");}
function formatPrice(price){if(price===null||price===undefined||price==="")return"تماس بگیرید";const n=Number(price);return Number.isNaN(n)?String(price):`${n.toLocaleString("fa-IR")} تومان`;}
function escapeHtml(value){return String(value??"").replaceAll("&","&amp;").replaceAll("<","&lt;").replaceAll(">","&gt;").replaceAll('"',"&quot;").replaceAll("'","&#039;");}
function changeQuantity(index,change){const cart=getCart();if(!cart[index])return;cart[index].quantity=Number(cart[index].quantity||1)+change;if(cart[index].quantity<=0)cart.splice(index,1);saveCart(cart);}
function removeItem(index){const cart=getCart();if(!cart[index])return;cart.splice(index,1);saveCart(cart);}
function renderCart(){
 const container=document.getElementById("cart-content"),cart=getCart();
 if(cart.length===0){container.innerHTML=`<div class="empty-cart"><p>سبد خرید شما خالی است.</p><a href="index.html" class="product-button">رفتن به فروشگاه</a></div>`;return;}
 let total=0;
 const itemsHtml=cart.map((item,index)=>{const price=Number(item.price)||0,quantity=Math.max(1,Number(item.quantity)||1);total+=price*quantity;return `<article class="cart-item"><img src="${escapeHtml(item.image||"../assets/products/placeholder.svg")}" alt="${escapeHtml(item.name)}" class="cart-item-image"><div class="cart-item-info"><h3>${escapeHtml(item.name)}</h3><div class="cart-item-price">${formatPrice(item.price)}</div><div class="quantity-controls"><button type="button" onclick="changeQuantity(${index},-1)" aria-label="کم کردن">−</button><span>${quantity.toLocaleString("fa-IR")}</span><button type="button" onclick="changeQuantity(${index},1)" aria-label="زیاد کردن">+</button><button type="button" class="remove-button" onclick="removeItem(${index})">حذف</button></div></div><div class="cart-line-total">${formatPrice(price*quantity)}</div></article>`;}).join("");
 container.innerHTML=`<div class="cart-list">${itemsHtml}</div><div class="cart-summary"><strong>مبلغ کل: ${formatPrice(total)}</strong><a href="checkout.html" class="product-button">ادامه و ثبت سفارش</a></div>`;
}
document.addEventListener("DOMContentLoaded",()=>{updateCartCount();renderCart();});
</script>
</body></html>
