<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>سبد خرید | تأسیسات آپادانا</title>
  <link rel="stylesheet" href="store.css">
</head>

<body>

<header class="store-header">
  <div class="container">
    <a href="index.html" class="logo-link">
      <img src="../assets/logo-header.png" alt="تأسیسات آپادانا">
    </a>

    <nav class="store-nav">
      <a href="index.html">فروشگاه</a>
      <a href="cart.html">
        سبد خرید
        <span id="cart-count">0</span>
      </a>
      <a href="track-order.html">پیگیری سفارش</a>
      <a href="account.html">حساب کاربری</a>
      <a href="../support.html">پشتیبانی</a>
    </nav>
  </div>
</header>

<main class="container cart-page">

  <section class="cart-hero">
    <h1>سبد خرید</h1>
    <p>محصولات انتخاب‌شده خود را بررسی کنید.</p>
  </section>

  <section id="cart-content">
    <p class="loading">در حال بارگذاری سبد خرید...</p>
  </section>

</main>

<footer class="store-footer">
  <div class="container">
    <p>© تأسیسات آپادانا - تمامی حقوق محفوظ است.</p>
  </div>
</footer>

<script>
function getCart() {
  try {
    return JSON.parse(localStorage.getItem("tasisat_apadana_cart")) || [];
  } catch {
    return [];
  }
}

function saveCart(cart) {
  localStorage.setItem(
    "tasisat_apadana_cart",
    JSON.stringify(cart)
  );

  updateCartCount();
  renderCart();
}

function updateCartCount() {
  const element = document.getElementById("cart-count");

  if (!element) return;

  element.textContent = getCart()
    .reduce((total, item) => total + Number(item.quantity || 0), 0)
    .toLocaleString("fa-IR");
}

function formatPrice(price) {
  if (price === null || price === undefined || price === "") {
    return "تماس بگیرید";
  }

  const number = Number(price);

  return Number.isNaN(number)
    ? String(price)
    : `${number.toLocaleString("fa-IR")} تومان`;
}

function escapeHtml(value) {
  return String(value ?? "")
    .replaceAll("&", "&amp;")
    .replaceAll("<", "&lt;")
    .replaceAll(">", "&gt;")
    .replaceAll('"', "&quot;")
    .replaceAll("'", "&#039;");
}

function changeQuantity(index, change) {
  const cart = getCart();

  if (!cart[index]) return;

  cart[index].quantity =
    Number(cart[index].quantity || 1) + change;

  if (cart[index].quantity <= 0) {
    cart.splice(index, 1);
  }

  saveCart(cart);
}

function removeItem(index) {
  const cart = getCart();

  if (!cart[index]) return;

  cart.splice(index, 1);
  saveCart(cart);
}

function renderCart() {
  const container = document.getElementById("cart-content");
  const cart = getCart();

  if (cart.length === 0) {
    container.innerHTML = `
      <div class="cart-empty">
        <div class="cart-empty-icon">🛒</div>
        <h2>سبد خرید شما خالی است</h2>
        <p>هنوز محصولی به سبد خرید اضافه نکرده‌اید.</p>
        <a href="index.html" class="product-button cart-shop-button">
          رفتن به فروشگاه
        </a>
      </div>
    `;

    return;
  }

  let total = 0;

  const itemsHtml = cart.map((item, index) => {

    const price = Number(item.price) || 0;
    const quantity = Number(item.quantity) || 1;

    total += price * quantity;

    return `
      <article class="cart-item">

        <img
          src="${escapeHtml(item.image || "../assets/products/placeholder.svg")}"
          alt="${escapeHtml(item.name)}"
          class="cart-item-image"
        >

        <div class="cart-item-info">

          <h3>${escapeHtml(item.name)}</h3>

          <div class="cart-item-price">
            ${formatPrice(item.price)}
          </div>

          <div class="cart-item-controls">

            <div class="quantity-control">
              <button
                type="button"
                onclick="changeQuantity(${index}, 1)"
                aria-label="افزایش تعداد"
              >+</button>

              <span>
                ${quantity.toLocaleString("fa-IR")}
              </span>

              <button
                type="button"
                onclick="changeQuantity(${index}, -1)"
                aria-label="کاهش تعداد"
              >−</button>
            </div>

            <button
              type="button"
              class="remove-item"
              onclick="removeItem(${index})"
            >
              حذف
            </button>

          </div>

        </div>

      </article>
    `;

  }).join("");

  container.innerHTML = `

    <div class="cart-list">
      ${itemsHtml}
    </div>

    <div class="cart-summary">

      <div class="cart-total">
        <span>مبلغ کل</span>
        <strong>${formatPrice(total)}</strong>
      </div>

      <a
        href="checkout.html"
        class="product-button cart-checkout-button"
      >
        ادامه و ثبت سفارش
      </a>

    </div>

  `;
}

document.addEventListener("DOMContentLoaded", () => {
  updateCartCount();
  renderCart();
});
</script>

</body>
</html>
