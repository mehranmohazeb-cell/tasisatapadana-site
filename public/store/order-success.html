<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>سفارش ثبت شد | تأسیسات آپادانا</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Vazirmatn:wght@400;500;700;900&display=swap">
  <link rel="stylesheet" href="store.css">
</head>
<body>

<header class="store-header">
  <div class="container">
    <a href="index.html" class="logo-link">
      <img src="../assets/logo-header.png" alt="تأسیسات آپادانا">
    </a>
    <nav class="store-nav">
      <a href="index.html">فروشگاه</a>
      <a href="cart.html">سبد خرید <span id="cart-count">0</span></a>
      <a href="track-order.html">پیگیری سفارش</a>
      <a href="account.html">حساب کاربری</a>
      <a href="../support.html">پشتیبانی</a>
    </nav>
  </div>
</header>

<main class="container">
  <div id="success-content" class="order-success-card">
    <p class="loading">در حال بارگذاری...</p>
  </div>
</main>

<footer class="store-footer">
  <div class="container">
    <p>© تأسیسات آپادانا - تمامی حقوق محفوظ است.</p>
  </div>
</footer>

<script src="order-config.js"></script>
<script>
function getCart() {
  try { return JSON.parse(localStorage.getItem("tasisat_apadana_cart")) || []; }
  catch { return []; }
}

function updateCartCount() {
  const el = document.getElementById("cart-count");
  if (!el) return;
  el.textContent = getCart().reduce((t, i) => t + Number(i.quantity || 0), 0).toLocaleString("fa-IR");
}

function formatPrice(price) {
  return `${(Number(price) || 0).toLocaleString("fa-IR")} تومان`;
}

function escapeHtml(value) {
  return String(value ?? "")
    .replaceAll("&", "&amp;").replaceAll("<", "&lt;").replaceAll(">", "&gt;")
    .replaceAll('"', "&quot;").replaceAll("'", "&#039;");
}

function formatDate(value) {
  try { return new Date(value).toLocaleString("fa-IR"); }
  catch { return String(value); }
}

document.addEventListener("DOMContentLoaded", () => {
  updateCartCount();

  const container = document.getElementById("success-content");
  const raw = sessionStorage.getItem("apadana_last_order");

  if (!raw) {
    container.innerHTML = `
      <div class="order-success-icon">✅</div>
      <h1>سفارش شما ثبت شد</h1>
      <p>کد پیگیری سفارش برای شما پیامک/نمایش داده شده بود. برای مشاهده وضعیت سفارش، از صفحه «پیگیری سفارش» با کد پیگیری و شماره موبایل خود استفاده کنید.</p>
      <a href="track-order.html" class="product-button" style="display:inline-block;width:auto;margin-top:10px;">پیگیری سفارش</a>
    `;
    return;
  }

  let order;
  try { order = JSON.parse(raw); } catch { order = null; }

  if (!order) {
    container.innerHTML = `<p>اطلاعات سفارش در دسترس نیست.</p>`;
    return;
  }

  const items = Array.isArray(order.items) ? order.items : [];
  const itemsHtml = items.map((item) => {
    const price = Number(item.price) || 0;
    const quantity = Number(item.quantity) || 1;
    return `<div class="summary-line"><span>${escapeHtml(item.name)} × ${quantity.toLocaleString("fa-IR")}</span><strong>${formatPrice(price * quantity)}</strong></div>`;
  }).join("");

  container.innerHTML = `
    <div class="order-success-icon">✅</div>
    <h1>سفارش شما با موفقیت ثبت شد</h1>
    <p>این کد پیگیری را نزد خود نگه دارید:</p>
    <div class="tracking-code-box">${escapeHtml(order.tracking_code)}</div>
    <div class="order-success-details">
      <div class="summary-line"><span>مبلغ سفارش</span><strong>${formatPrice(order.total)}</strong></div>
      <div class="summary-line"><span>تاریخ ثبت</span><strong>${escapeHtml(formatDate(order.created_at))}</strong></div>
      <div class="summary-line"><span>شماره موبایل</span><strong>${escapeHtml(order.mobile)}</strong></div>
      <h3 style="margin-top:20px;">خلاصه سفارش</h3>
      ${itemsHtml}
    </div>
    <a href="track-order.html?tracking_code=${encodeURIComponent(order.tracking_code)}" class="product-button" style="display:inline-block;width:auto;margin-top:22px;">پیگیری سفارش</a>
  `;

  sessionStorage.removeItem("apadana_last_order");
});
</script>
</body>
</html>
