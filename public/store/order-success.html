<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>سفارش ثبت شد | تأسیسات آپادانا</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Vazirmatn:wght@400;500;700;900&display=swap">
  <link rel="stylesheet" href="store.css">
</head>
<body>

<header class="store-header">
  <div class="container">
    <a href="index.html" class="logo-link">
      <img src="../assets/logo-header.png" alt="تأسیسات آپادانا">
    </a>

    <nav class="store-nav">
      <a href="index.html">فروشگاه</a>
      <a href="cart.html" class="nav-cart-link"><svg class="nav-icon" viewBox="0 0 24 24" aria-hidden="true" focusable="false"><path fill="currentColor" d="M7 18c-1.1 0-1.99.9-1.99 2S5.9 22 7 22s2-.9 2-2-.9-2-2-2zM1 2v2h2l3.6 7.59-1.35 2.44C4.52 14.37 5 16 6 16h12v-2H6.42c-.14 0-.25-.11-.25-.25l.03-.12L7.1 12h7.45c.75 0 1.41-.41 1.75-1.03l3.58-6.49c.08-.14.12-.31.12-.48 0-.55-.45-1-1-1H5.21l-.94-2H1zm16 18c-1.1 0-1.99.9-1.99 2s.89 2 1.99 2 2-.9 2-2-.9-2-2-2z"/></svg>سبد خرید <span id="cart-count">0</span></a>
      <a href="track-order.html">پیگیری سفارش</a>
      <a href="account.html" class="nav-account-link"><svg class="nav-icon" viewBox="0 0 24 24" aria-hidden="true" focusable="false"><path fill="currentColor" d="M12 12c2.21 0 4-1.79 4-4s-1.79-4-4-4-4 1.79-4 4 1.79 4 4 4zm0 2c-2.67 0-8 1.34-8 4v2h16v-2c0-2.66-5.33-4-8-4z"/></svg>حساب کاربری</a>
      <a href="../support.html">پشتیبانی</a>
    </nav>
  </div>
</header>

<main class="container">
  <div id="success-content" class="order-success-card">
    <p class="loading">در حال بارگذاری...</p>
  </div>
</main>

<footer class="store-footer">
  <div class="container">
    <p>© تأسیسات آپادانا - تمامی حقوق محفوظ است.</p>
  </div>
</footer>

<script src="order-config.js"></script>

<script>
function getCart() {
  try {
    return JSON.parse(
      localStorage.getItem("tasisat_apadana_cart")
    ) || [];
  } catch {
    return [];
  }
}

function updateCartCount() {
  const el = document.getElementById("cart-count");

  if (!el) return;

  el.textContent = getCart()
    .reduce(
      (t, i) => t + Number(i.quantity || 0),
      0
    )
    .toLocaleString("fa-IR");
}

function formatPrice(price) {
  return `${(Number(price) || 0).toLocaleString("fa-IR")} تومان`;
}

function escapeHtml(value) {
  return String(value ?? "")
    .replaceAll("&", "&amp;")
    .replaceAll("<", "&lt;")
    .replaceAll(">", "&gt;")
    .replaceAll('"', "&quot;")
    .replaceAll("'", "&#039;");
}

function formatDate(value) {
  try {
    return new Date(value).toLocaleString("fa-IR");
  } catch {
    return String(value);
  }
}

// =========================================================
// کپی کد پیگیری — با Clipboard API (مدرن) و fallback برای
// مرورگرهایی که به آن دسترسی ندارند (مثلاً برخی WebViewهای قدیمی موبایل).
// =========================================================

function copyTrackingCode(code) {
  const button = document.getElementById("copy-tracking-code");

  const showCopiedFeedback = () => {
    if (!button) return;
    const originalText = button.dataset.originalText || button.textContent;
    button.dataset.originalText = originalText;
    button.textContent = "✅ کپی شد";
    button.disabled = true;
    setTimeout(() => {
      button.textContent = originalText;
      button.disabled = false;
    }, 1800);
  };

  const fallbackCopy = () => {
    try {
      const textarea = document.createElement("textarea");
      textarea.value = code;
      textarea.setAttribute("readonly", "");
      textarea.style.position = "fixed";
      textarea.style.opacity = "0";
      document.body.appendChild(textarea);
      textarea.select();
      textarea.setSelectionRange(0, textarea.value.length);
      document.execCommand("copy");
      document.body.removeChild(textarea);
      showCopiedFeedback();
    } catch {
      alert("کپی خودکار ممکن نشد. لطفاً کد پیگیری را به‌صورت دستی کپی کنید.");
    }
  };

  if (navigator.clipboard && window.isSecureContext) {
    navigator.clipboard.writeText(code).then(showCopiedFeedback).catch(fallbackCopy);
  } else {
    fallbackCopy();
  }
}

document.addEventListener("DOMContentLoaded", () => {

  updateCartCount();

  const container =
    document.getElementById("success-content");

  const raw =
    sessionStorage.getItem("apadana_last_order");


  // ==========================================
  // اگر اطلاعات سفارش در sessionStorage نبود
  // ==========================================

  if (!raw) {

    container.innerHTML = `
      <div class="order-success-icon">✅</div>

      <h1>سفارش شما ثبت شد</h1>

      <p>
        کد پیگیری سفارش برای شما پیامک/نمایش داده شده بود.
        برای مشاهده وضعیت سفارش، از صفحه «پیگیری سفارش»
        با کد پیگیری و شماره موبایل خود استفاده کنید.
      </p>

      <a
        href="track-order.html"
        class="product-button"
        style="display:inline-block;width:auto;margin-top:10px;"
      >
        پیگیری سفارش
      </a>
    `;

    return;
  }


  // ==========================================
  // خواندن اطلاعات سفارش
  // ==========================================

  let order;

  try {
    order = JSON.parse(raw);
  } catch {
    order = null;
  }


  if (!order) {

    container.innerHTML = `
      <p>اطلاعات سفارش در دسترس نیست.</p>
    `;

    return;
  }


  // ==========================================
  // اقلام سفارش
  // ==========================================

  const items =
    Array.isArray(order.items)
      ? order.items
      : [];


  const itemsHtml =
    items.map((item) => {

      const price =
        Number(item.price) || 0;

      const quantity =
        Number(item.quantity) || 1;

      return `
        <div class="summary-line">
          <span>
            ${escapeHtml(item.name)}
            ×
            ${quantity.toLocaleString("fa-IR")}
          </span>

          <strong>
            ${formatPrice(price * quantity)}
          </strong>
        </div>
      `;

    }).join("");


  // ==========================================
  // نمایش نتیجه سفارش
  // ==========================================

  container.innerHTML = `

    <div class="order-success-icon">
      ✅
    </div>

    <h1>
      سفارش شما با موفقیت ثبت شد
    </h1>

    <p>
      این کد پیگیری را نزد خود نگه دارید:
    </p>

    <div class="tracking-code-box">
      <span id="tracking-code-text">${escapeHtml(order.tracking_code)}</span>
      <button
        type="button"
        id="copy-tracking-code"
        class="copy-btn"
        onclick="copyTrackingCode('${escapeHtml(order.tracking_code)}')"
        aria-label="کپی کد پیگیری"
      >
        📋 کپی
      </button>
    </div>


    <div class="order-success-details">

      <div class="summary-line">
        <span>مبلغ سفارش</span>

        <strong>
          ${formatPrice(order.total)}
        </strong>
      </div>

      ${order.shipping_method_name ? `
      <div class="summary-line">
        <span>روش ارسال</span>
        <strong>${escapeHtml(order.shipping_method_name)}${order.shipping_is_cod ? " (پس‌کرایه)" : ""}</strong>
      </div>
      ` : ""}


      <div class="summary-line">
        <span>تاریخ ثبت</span>

        <strong>
          ${escapeHtml(
            formatDate(order.created_at)
          )}
        </strong>
      </div>


      <div class="summary-line">
        <span>شماره موبایل</span>

        <strong>
          ${escapeHtml(order.mobile)}
        </strong>
      </div>


      <h3 style="margin-top:20px;">
        خلاصه سفارش
      </h3>

      ${itemsHtml}

    </div>


    <!-- دکمه‌های سفارش -->

    <div
      style="
        display:flex;
        flex-wrap:wrap;
        justify-content:center;
        align-items:center;
        gap:10px;
        margin-top:22px;
      "
    >

      <a
        href="invoice.html"
        class="product-button"
        style="display:inline-block;width:auto;"
      >
        مشاهده فاکتور
      </a>


      <a
        href="track-order.html?tracking_code=${encodeURIComponent(order.tracking_code)}"
        class="product-button"
        style="display:inline-block;width:auto;"
      >
        پیگیری سفارش
      </a>

    </div>
  `;


  // ==========================================
  // نکته:
  // اطلاعات apadana_last_order عمداً حذف نمی‌شود.
  // صفحه invoice.html برای مشتری مهمان به آن نیاز دارد.
  // ==========================================

});
</script>

</body>
</html>
