<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>حساب کاربری | تأسیسات آپادانا</title>
  <meta name="description" content="ورود یا ثبت‌نام در فروشگاه تأسیسات آپادانا برای مشاهده سفارش‌های قبلی.">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Vazirmatn:wght@400;500;700;900&display=swap">
  <link rel="stylesheet" href="store.css">
</head>
<body>

<header class="store-header">
  <div class="container">
    <a href="index.html" class="logo-link">
      <img src="../assets/logo-header.png" alt="تأسیسات آپادانا">
    </a>
    <nav class="store-nav">
      <a href="index.html">فروشگاه</a>
      <a href="cart.html">سبد خرید <span id="cart-count">0</span></a>
      <a href="track-order.html">پیگیری سفارش</a>
      <a href="account.html">حساب کاربری</a>
      <a href="../support.html">پشتیبانی</a>
    </nav>
  </div>
</header>

<main class="container">

  <section class="order-page-title" style="text-align:center;">
    <h1>حساب کاربری</h1>
    <p>ثبت‌نام برای سفارش لازم نیست، اما با داشتن حساب کاربری می‌توانید سفارش‌های قبلی خود را ببینید و آدرس ذخیره کنید.</p>
  </section>

  <div id="logged-in-view" class="form-card" style="max-width:480px;margin:0 auto;display:none;text-align:center;">
    <p>شما با شماره <strong id="logged-in-phone"></strong> وارد شده‌اید.</p>
    <a href="my-orders.html" class="product-button" style="display:inline-block;width:auto;margin:10px 6px;">سفارش‌های من</a>
    <button type="button" class="secondary-button" id="logout-button" style="margin:10px 6px;">خروج از حساب</button>
  </div>

  <div id="guest-view" class="form-card" style="max-width:480px;margin:0 auto;">

    <div class="auth-tabs">
      <button type="button" class="auth-tab-button is-active" data-tab="login">ورود</button>
      <button type="button" class="auth-tab-button" data-tab="register">ثبت‌نام</button>
    </div>

    <form id="login-form" class="auth-form is-active" novalidate>
      <div class="field-grid">
        <label class="field field-full">
          شماره موبایل
          <input id="login-mobile" type="tel" inputmode="numeric" placeholder="09xxxxxxxxx" maxlength="11" required>
        </label>
        <label class="field field-full">
          رمز عبور
          <input id="login-password" type="password" required>
        </label>
      </div>
      <div class="form-submit-row">
        <button type="submit" class="product-button">ورود</button>
      </div>
      <div id="login-message" class="form-message"></div>
    </form>

    <form id="register-form" class="auth-form" novalidate>
      <div class="field-grid">
        <label class="field field-full">
          نام و نام خانوادگی
          <input id="register-name" type="text" required>
        </label>
        <label class="field field-full">
          شماره موبایل
          <input id="register-mobile" type="tel" inputmode="numeric" placeholder="09xxxxxxxxx" maxlength="11" required>
        </label>
        <label class="field field-full">
          رمز عبور (حداقل ۶ کاراکتر)
          <input id="register-password" type="password" required>
        </label>
      </div>
      <div class="form-submit-row">
        <button type="submit" class="product-button">ایجاد حساب کاربری</button>
      </div>
      <div id="register-message" class="form-message"></div>
    </form>

  </div>

</main>

<footer class="store-footer">
  <div class="container">
    <p>© تأسیسات آپادانا - تمامی حقوق محفوظ است.</p>
  </div>
</footer>

<script src="order-config.js"></script>
<script>
const API_BASE = "/api/store";

function getCart() {
  try { return JSON.parse(localStorage.getItem("tasisat_apadana_cart")) || []; }
  catch { return []; }
}

function updateCartCount() {
  const el = document.getElementById("cart-count");
  if (!el) return;
  el.textContent = getCart().reduce((t, i) => t + Number(i.quantity || 0), 0).toLocaleString("fa-IR");
}

function showMessage(id, text, type) {
  const el = document.getElementById(id);
  el.textContent = text;
  el.className = `form-message is-visible ${type === "error" ? "is-error" : "is-success"}`;
}

function switchTab(tab) {
  document.querySelectorAll(".auth-tab-button").forEach((btn) => {
    btn.classList.toggle("is-active", btn.dataset.tab === tab);
  });
  document.getElementById("login-form").classList.toggle("is-active", tab === "login");
  document.getElementById("register-form").classList.toggle("is-active", tab === "register");
}

async function checkSession() {
  const response = await fetch(`${API_BASE}/customers/me`, { credentials: "include" });
  const data = await response.json();

  if (data.logged_in) {
    document.getElementById("logged-in-view").style.display = "block";
    document.getElementById("guest-view").style.display = "none";
    document.getElementById("logged-in-phone").textContent = data.customer.phone;
  } else {
    document.getElementById("logged-in-view").style.display = "none";
    document.getElementById("guest-view").style.display = "block";
  }
}

async function submitLogin(event) {
  event.preventDefault();

  const mobile = window.normalizeDigits(document.getElementById("login-mobile").value).trim();
  const password = document.getElementById("login-password").value;

  try {
    const response = await fetch(`${API_BASE}/customers/login`, {
      method: "POST",
      credentials: "include",
      headers: { "Content-Type": "application/json" },
      body: JSON.stringify({ mobile, password }),
    });

    const data = await response.json();
    if (!response.ok || !data.ok) throw new Error(data.message || "ورود ناموفق بود.");

    showMessage("login-message", "با موفقیت وارد شدید.", "success");
    checkSession();
  } catch (error) {
    showMessage("login-message", error.message, "error");
  }
}

async function submitRegister(event) {
  event.preventDefault();

  const name = document.getElementById("register-name").value.trim();
  const mobile = window.normalizeDigits(document.getElementById("register-mobile").value).trim();
  const password = document.getElementById("register-password").value;

  try {
    const response = await fetch(`${API_BASE}/customers/register`, {
      method: "POST",
      credentials: "include",
      headers: { "Content-Type": "application/json" },
      body: JSON.stringify({ full_name: name, mobile, password }),
    });

    const data = await response.json();
    if (!response.ok || !data.ok) throw new Error(data.message || "ثبت‌نام ناموفق بود.");

    showMessage("register-message", "حساب کاربری با موفقیت ایجاد شد.", "success");
    checkSession();
  } catch (error) {
    showMessage("register-message", error.message, "error");
  }
}

async function logout() {
  await fetch(`${API_BASE}/customers/logout`, { method: "POST", credentials: "include" });
  checkSession();
}

document.addEventListener("DOMContentLoaded", () => {
  updateCartCount();
  checkSession();

  document.querySelectorAll(".auth-tab-button").forEach((btn) => {
    btn.addEventListener("click", () => switchTab(btn.dataset.tab));
  });

  document.getElementById("login-form").addEventListener("submit", submitLogin);
  document.getElementById("register-form").addEventListener("submit", submitRegister);
  document.getElementById("logout-button").addEventListener("click", logout);
});
</script>
</body>
</html>
