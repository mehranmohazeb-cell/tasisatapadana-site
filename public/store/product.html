<!DOCTYPE html>
<html lang="fa" dir="rtl">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

<body>

<main>

  <section class="store-hero">

    <div
      class="store-hero-pattern"
      aria-hidden="true"
    ></div>

    <div class="container store-hero-inner">

      <span class="store-badge">
        فروشگاه تأسیسات آپادانا
      </span>

      <h1>
        جزئیات محصول
      </h1>

      <p>
        اطلاعات، تصاویر و مشخصات محصول
      </p>

  </section>


  <section class="container">

    <div
      id="product-detail"

        در حال بارگذاری محصول...
      </p>

</main>


<!-- =======================================================
     نمایش تمام‌صفحه تصویر
======================================================= -->

<div
  id="image-lightbox"
  class="image-lightbox"
  hidden
  aria-hidden="true"
>

  <button
    type="button"
    class="lightbox-close"
    onclick="closeLightbox()"
    aria-label="بستن تصویر"
  >
    ×
  </button>


  <button
    type="button"
    id="lightbox-prev"
    class="lightbox-arrow lightbox-prev"
    onclick="changeLightboxImage(-1)"
    aria-label="تصویر قبلی"
  >
    ‹
  </button>


  <div class="lightbox-content">

    <img
      id="lightbox-image"
      src=""
      alt=""
      draggable="false"
    >

  </div>


  <button
    type="button"
    id="lightbox-next"
    class="lightbox-arrow lightbox-next"
    onclick="changeLightboxImage(1)"
    aria-label="تصویر بعدی"
  >
    ›
  </button>

</div>


<footer class="store-footer">

  <div class="container">

    <p>
      © تأسیسات آپادانا - تمامی حقوق محفوظ است.
    </p>

  </div>

</footer>


<script>

const API_BASE = "/api/store";

let currentProduct = null;

let currentImageIndex = 0;

let productImages = [];


/* =========================================================
   ابزارهای عمومی
========================================================= */


function escapeHtml(value) {

  return String(value ?? "")
    .replace(/&/g, "&amp;")
    .replace(/</g, "&lt;")
    .replace(/>/g, "&gt;")
    .replace(/"/g, "&quot;")
    .replace(/'/g, "&#039;");

}


function formatPrice(value) {

  return `${Number(value || 0).toLocaleString("fa-IR")} تومان`;

}


/* =========================================================
   مسیر صحیح تصاویر
========================================================= */

function getProductImageUrl(image) {

  if (!image) {

    return "/assets/products/placeholder.svg";

  }


  const value =
    String(image).trim();


  if (
    value.startsWith("http://") ||
    value.startsWith("https://") ||
    value.startsWith("data:")
  ) {

    return value;

  }


  if (value.startsWith("/")) {

    return value;

  }


  if (value.startsWith("assets/")) {

    return "/" + value;

  }


  if (value.startsWith("products/")) {

    return "/assets/" + value;

  }


  return "/assets/products/" + value;

}


/* =========================================================
   دریافت تصاویر محصول
========================================================= */

function getProductImages(product) {

  let images = [];


  if (
    Array.isArray(product.images) &&
    product.images.length > 0
  ) {

    images =
      product.images
        .map(item => {

          if (typeof item === "string") {

            return item;

          }

          return item?.image || "";

        })
        .filter(Boolean);

  }


  if (
    images.length === 0 &&
    product.image
  ) {

    images = [
      product.image
    ];

  }


  if (images.length === 0) {

    images = [
      "/assets/products/placeholder.svg"
    ];

  }


  return images.map(
    getProductImageUrl
  );

}


/* =========================================================
   نمایش تصویر اصلی و گالری
========================================================= */

function renderProductImages(product) {

  productImages =
    getProductImages(product);


  currentImageIndex = 0;


  const mainImage =
    productImages[0];


  const navigation =
    productImages.length > 1
      ? `

        <button
          type="button"
          class="product-image-arrow product-image-arrow-prev"
          onclick="changeProductImage(-1)"
          aria-label="تصویر قبلی"
        >
          ‹
        </button>

        <button
          type="button"
          class="product-image-arrow product-image-arrow-next"
          onclick="changeProductImage(1)"
          aria-label="تصویر بعدی"
        >
          ›
        </button>

      `
      : "";


  const thumbnails =
    productImages.length > 1
      ? `

        <div
          class="product-thumbnails"
          aria-label="تصاویر محصول"
        >

          ${productImages
            .map(
              (image, index) => `

                <button
                  type="button"
                  class="product-thumbnail ${
                    index === 0
                      ? "active"
                      : ""
                  }"
                  onclick="selectProductImage(${index})"
                  aria-label="نمایش تصویر ${index + 1}"
                >

                  <img
                    src="${escapeHtml(image)}"
                    alt="${escapeHtml(product.name)} - تصویر ${index + 1}"
                    loading="lazy"
                  >

                </button>

              `
            )
            .join("")}

        </div>

      `
      : "";


  return `

    <div class="product-detail-media">

      <div
        class="product-main-image"
        id="product-image-slider"
      >

        <img
          id="main-product-image"
          src="${escapeHtml(mainImage)}"
          alt="${escapeHtml(product.name)}"
          class="product-detail-image"
          draggable="false"
          onclick="openLightbox()"
        >

        ${navigation}

      </div>

      ${thumbnails}

    </div>

  `;

}


/* =========================================================
   انتخاب تصویر
========================================================= */

function selectProductImage(index) {

  if (
    !productImages[index]
  ) {

    return;

  }


  currentImageIndex =
    index;


  const mainImage =
    document.getElementById(
      "main-product-image"
    );


  if (mainImage) {

    mainImage.src =
      productImages[index];

    mainImage.alt =
      `${currentProduct.name} - تصویر ${index + 1}`;

  }


  document
    .querySelectorAll(
      ".product-thumbnail"
    )
    .forEach(
      (thumbnail, thumbnailIndex) => {

        thumbnail.classList.toggle(
          "active",
          thumbnailIndex === index
        );

      }
    );

}


/* =========================================================
   تغییر تصویر با فلش
========================================================= */

function changeProductImage(direction) {

  if (
    productImages.length <= 1
  ) {

    return;

  }


  let newIndex =
    currentImageIndex +
    direction;


  if (newIndex < 0) {

    newIndex =
      productImages.length - 1;

  }


  if (
    newIndex >=
    productImages.length
  ) {

    newIndex = 0;

  }


  selectProductImage(
    newIndex
  );

}


/* =========================================================
   سوایپ تصویر با انگشت
========================================================= */

function setupImageSwipe() {

  const slider =
    document.getElementById(
      "product-image-slider"
    );


  if (!slider) {

    return;

  }


  let startX = 0;

  let startY = 0;

  let isDragging = false;


  slider.addEventListener(
    "touchstart",
    event => {

      if (
        !event.touches ||
        !event.touches.length
      ) {

        return;

      }


      startX =
        event.touches[0].clientX;

      startY =
        event.touches[0].clientY;

      isDragging = true;

    },
    {
      passive: true
    }
  );


  slider.addEventListener(
    "touchend",
    event => {

      if (!isDragging) {

        return;

      }


      isDragging = false;


      if (
        !event.changedTouches ||
        !event.changedTouches.length
      ) {

        return;

      }


      const endX =
        event.changedTouches[0].clientX;

      const endY =
        event.changedTouches[0].clientY;


      const deltaX =
        endX - startX;

      const deltaY =
        endY - startY;


      if (
        Math.abs(deltaX) < 45 ||
        Math.abs(deltaX) <
          Math.abs(deltaY)
      ) {

        return;

      }


      if (deltaX < 0) {

        changeProductImage(1);

      } else {

        changeProductImage(-1);

      }

    },
    {
      passive: true
    }
  );


  slider.addEventListener(
    "dragstart",
    event => {

      event.preventDefault();

    }
  );

}


/* =========================================================
   نمایش تمام‌صفحه تصویر
========================================================= */

function openLightbox() {

  if (!currentProduct) {

    return;

  }


  const lightbox =
    document.getElementById(
      "image-lightbox"
    );


  const image =
    document.getElementById(
      "lightbox-image"
    );


  if (!lightbox || !image) {

    return;

  }


  image.src =
    productImages[
      currentImageIndex
    ];


  image.alt =
    `${currentProduct.name} - تصویر ${currentImageIndex + 1}`;


  updateLightboxNavigation();


  lightbox.hidden = false;

  lightbox.setAttribute(
    "aria-hidden",
    "false"
  );


  document.body.classList.add(
    "lightbox-open"
  );

}


/* =========================================================
   بستن تصویر تمام‌صفحه
========================================================= */

function closeLightbox() {

  const lightbox =
    document.getElementById(
      "image-lightbox"
    );


  if (!lightbox) {

    return;

  }


  lightbox.hidden = true;

  lightbox.setAttribute(
    "aria-hidden",
    "true"
  );


  document.body.classList.remove(
    "lightbox-open"
  );

}


/* =========================================================
   تغییر تصویر در حالت تمام‌صفحه
========================================================= */

function changeLightboxImage(
  direction
) {

  if (
    productImages.length <= 1
  ) {

    return;

  }


  let newIndex =
    currentImageIndex +
    direction;


  if (newIndex < 0) {

    newIndex =
      productImages.length - 1;

  }


  if (
    newIndex >=
    productImages.length
  ) {

    newIndex = 0;

  }


  selectProductImage(
    newIndex
  );


  const image =
    document.getElementById(
      "lightbox-image"
    );


  if (image) {

    image.src =
      productImages[newIndex];

    image.alt =
      `${currentProduct.name} - تصویر ${newIndex + 1}`;

  }


  updateLightboxNavigation();

}


/* =========================================================
   وضعیت فلش‌های تمام‌صفحه
========================================================= */

function updateLightboxNavigation() {

  const previous =
    document.getElementById(
      "lightbox-prev"
    );


  const next =
    document.getElementById(
      "lightbox-next"
    );


  if (!previous || !next) {

    return;

  }


  if (
    productImages.length <= 1
  ) {

    previous.hidden = true;

    next.hidden = true;

  } else {

    previous.hidden = false;

    next.hidden = false;

  }

}


/* =========================================================
   سوایپ در حالت تمام‌صفحه
========================================================= */

function setupLightboxSwipe() {

  const lightbox =
    document.getElementById(
      "image-lightbox"
    );


  if (!lightbox) {

    return;

  }


  let startX = 0;

  let startY = 0;


  lightbox.addEventListener(
    "touchstart",
    event => {

      if (
        !event.touches ||
        !event.touches.length
      ) {

        return;

      }


      startX =
        event.touches[0].clientX;

      startY =
        event.touches[0].clientY;

    },
    {
      passive: true
    }
  );


  lightbox.addEventListener(
    "touchend",
    event => {

      if (
        !event.changedTouches ||
        !event.changedTouches.length
      ) {

        return;

      }


      const endX =
        event.changedTouches[0].clientX;

      const endY =
        event.changedTouches[0].clientY;


      const deltaX =
        endX - startX;

      const deltaY =
        endY - startY;


      if (
        Math.abs(deltaX) < 45 ||
        Math.abs(deltaX) <
          Math.abs(deltaY)
      ) {

        return;

      }


      if (deltaX < 0) {

        changeLightboxImage(1);

      } else {

        changeLightboxImage(-1);

      }

    },
    {
      passive: true
    }
  );

}


/* =========================================================
   بستن با کلیک بیرون تصویر
========================================================= */

function setupLightboxCloseOnOutsideClick() {

  const lightbox =
    document.getElementById(
      "image-lightbox"
    );


  const content =
    document.querySelector(
      ".lightbox-content"
    );


  if (!lightbox || !content) {

    return;

  }


  lightbox.addEventListener(
    "click",
    event => {

      if (
        event.target ===
        lightbox
      ) {

        closeLightbox();

      }

    }
  );

}


/* =========================================================
   باز و بسته کردن توضیحات
========================================================= */

function toggleProductInfo() {

  const panel =
    document.getElementById(
      "product-info-panel"
    );


  const button =
    document.getElementById(
      "product-info-toggle"
    );


  if (!panel || !button) {

    return;

  }


  const isHidden =
    panel.hasAttribute(
      "hidden"
    );


  if (isHidden) {

    panel.removeAttribute(
      "hidden"
    );


    button.setAttribute(
      "aria-expanded",
      "true"
    );


    button.textContent =
      "بستن توضیحات و مشخصات فنی";

  } else {

    panel.setAttribute(
      "hidden",
      ""
    );


    button.setAttribute(
      "aria-expanded",
      "false"
    );


    button.textContent =
      "توضیحات و مشخصات فنی";

  }

}


/* =========================================================
   سبد خرید
========================================================= */

function getCart() {

  try {

    return JSON.parse(
      localStorage.getItem(
        "tasisat_apadana_cart"
      ) || "[]"
    );

  } catch {

    return [];

  }

}


function saveCart(cart) {

  localStorage.setItem(
    "tasisat_apadana_cart",
    JSON.stringify(cart)
  );

}


function updateCartCount() {

  const cart =
    getCart();


  const count =
    cart.reduce(
      (total, item) =>
        total +
        Number(item.quantity || 0),
      0
    );


  const element =
    document.getElementById(
      "cart-count"
    );


  if (element) {

    element.textContent =
      count.toLocaleString("fa-IR");

  }

}


/* =========================================================
   افزودن محصول به سبد
========================================================= */

function addProductToCart() {

  if (!currentProduct) {

    return;

  }


  const quantityInput =
    document.getElementById(
      "quantity"
    );


  let quantity =
    Number(
      quantityInput?.value || 1
    );


  if (!Number.isInteger(quantity)) {

    quantity = 1;

  }


  quantity =
    Math.max(
      1,
      quantity
    );


  const stock =
    Number(
      currentProduct.stock || 0
    );


  if (
    stock <= 0
  ) {

    alert(
      "این محصول در حال حاضر ناموجود است."
    );

    return;

  }


  if (
    quantity > stock
  ) {

    alert(
      "تعداد انتخاب‌شده بیشتر از موجودی محصول است."
    );

    return;

  }


  const cart =
    getCart();


  const existing =
    cart.find(
      item =>
        String(item.id) ===
        String(currentProduct.id)
    );


  if (existing) {

    existing.quantity +=
      quantity;


    if (
      existing.quantity >
      stock
    ) {

      existing.quantity =
        stock;

    }

  } else {

    cart.push({

      id:
        currentProduct.id,

      name:
        currentProduct.name,

      price:
        currentProduct.price,

      image:
        productImages[0] ||
        getProductImageUrl(
          currentProduct.image
        ),

      quantity:
        quantity

    });

  }


  saveCart(cart);

  updateCartCount();


  alert(
    "محصول به سبد خرید اضافه شد."
  );

}


/* =========================================================
   دریافت محصول و ساخت صفحه
========================================================= */

async function loadProduct() {

  const container =
    document.getElementById(
      "product-detail"
    );


  const slug =
    new URLSearchParams(
      window.location.search
    ).get("slug");


  if (!slug) {

    container.innerHTML = `

      <div class="product-detail-card">

        <div class="product-detail-content">

          <h1>
            محصول پیدا نشد
          </h1>

          <p class="product-description">
            شناسه محصول مشخص نشده است.
          </p>

          <a
            href="index.html"
            class="back-link"
          >
            بازگشت به فروشگاه
          </a>

        </div>

      </div>

    `;

    return;

  }


  try {

    const response =
      await fetch(
        `${API_BASE}/products/${encodeURIComponent(slug)}`
      );


    if (!response.ok) {

      throw new Error(
        "PRODUCT_NOT_FOUND"
      );

    }


    const data =
      await response.json();


    if (
      !data ||
      !data.product
    ) {

      throw new Error(
        "PRODUCT_NOT_FOUND"
      );

    }


    currentProduct =
      data.product;


    productImages =
      getProductImages(
        currentProduct
      );


    container.innerHTML = `

      <div class="product-detail-card">


        ${renderProductImages(
          currentProduct
        )}


        <div class="product-detail-content">


          <h1>
            ${escapeHtml(
              currentProduct.name ||
              "محصول"
            )}
          </h1>


          ${
            currentProduct.description
              ? `

                <button
                  type="button"
                  id="product-info-toggle"
                  class="product-info-toggle"
                  aria-expanded="false"
                  onclick="toggleProductInfo()"
                >
                  توضیحات و مشخصات فنی
                </button>


                <div
                  id="product-info-panel"
                  class="product-info-panel"
                  hidden
                >

                  <div class="product-description">

                    ${escapeHtml(
                      currentProduct.description
                    )}

                  </div>

                </div>

              `
              : ""
          }


          <div class="product-detail-price">

            ${formatPrice(
              currentProduct.price
            )}

          </div>


          <div class="product-detail-stock">

            ${
              Number(
                currentProduct.stock || 0
              ) > 0

                ? `موجودی: ${Number(
                    currentProduct.stock
                  ).toLocaleString("fa-IR")} عدد`

                : "در حال حاضر ناموجود"
            }

          </div>


          <div class="product-actions">

            <label for="quantity">
              تعداد:
            </label>


            <input
              id="quantity"
              type="number"
              min="1"
              max="${Math.max(
                Number(
                  currentProduct.stock || 0
                ),
                1
              )}"
              value="1"
              ${
                Number(
                  currentProduct.stock || 0
                ) <= 0
                  ? "disabled"
                  : ""
              }
            >


            <button
              type="button"
              class="product-button"
              onclick="addProductToCart()"
              ${
                Number(
                  currentProduct.stock || 0
                ) <= 0
                  ? "disabled"
                  : ""
              }
            >
              ${
                Number(
                  currentProduct.stock || 0
                ) > 0
                  ? "افزودن به سبد خرید"
                  : "محصول ناموجود است"
              }
            </button>

          </div>


          <a
            href="index.html"
            class="back-link"
          >
            ← بازگشت به فروشگاه
          </a>


        </div>

      </div>

    `;


    setupImageSwipe();

    setupLightboxSwipe();

    setupLightboxCloseOnOutsideClick();

    updateLightboxNavigation();


  } catch (error) {

    console.error(error);


    container.innerHTML = `

      <div class="product-detail-card">

        <div class="product-detail-content">

          <h1>
            محصول پیدا نشد
          </h1>

          <p class="product-description">
            امکان دریافت اطلاعات این محصول وجود ندارد.
          </p>

          <a
            href="index.html"
            class="back-link"
          >
            ← بازگشت به فروشگاه
          </a>

        </div>

      </div>

    `;

  }

}


/* =========================================================
   کلیدهای صفحه‌کلید
========================================================= */

document.addEventListener(
  "keydown",
  event => {

    if (
      event.key === "Escape"
    ) {

      closeLightbox();

    }


    if (
      event.key === "ArrowLeft"
    ) {

      changeLightboxImage(1);

    }


    if (
      event.key === "ArrowRight"
    ) {

      changeLightboxImage(-1);

    }

  }
);


/* =========================================================
   شروع صفحه
========================================================= */

document.addEventListener(
  "DOMContentLoaded",
  () => {

    updateCartCount();

    loadProduct();

  }
);

</script>

</body>

</html>
