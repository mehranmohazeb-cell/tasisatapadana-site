<!DOCTYPE html>
<html lang="fa" dir="rtl">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>جزئیات محصول | تأسیسات آپادانا</title>

  <meta
    name="description"
    content="جزئیات محصول در فروشگاه تأسیسات آپادانا"
  >

  <link
    rel="preconnect"
    href="https://fonts.googleapis.com"
  >

  <link
    rel="preconnect"
    href="https://fonts.gstatic.com"
    crossorigin
  >

  <link
    rel="stylesheet"
    href="https://fonts.googleapis.com/css2?family=Vazirmatn:wght@400;500;700;900&display=swap"
  >

  <link
    rel="stylesheet"
    href="store.css"
  >
</head>


<body>

<header class="store-header">

  <div class="container">

    <a
      href="../index.html"
      class="logo-link"
    >
      <img
        src="../assets/logo-header.png"
        alt="تأسیسات آپادانا"
      >
    </a>


    <nav class="store-nav">

      <a href="../index.html">
        سایت اصلی
      </a>

      <a href="index.html">
        فروشگاه
      </a>

      <a href="cart.html">
        سبد خرید
        <span id="cart-count">0</span>
      </a>

      <a href="track-order.html">
        پیگیری سفارش
      </a>

      <a href="account.html">
        حساب کاربری
      </a>

      <a href="../support.html">
        پشتیبانی
      </a>

    </nav>

  </div>

</header>


<main>

  <section class="store-hero">

    <div
      class="store-hero-pattern"
      aria-hidden="true"
    ></div>


    <div class="container store-hero-inner">

      <span class="store-badge">
        فروشگاه تأسیسات آپادانا
      </span>

      <h1>
        جزئیات محصول
      </h1>

      <p>
        اطلاعات، تصاویر و مشخصات محصول
      </p>

    </div>

  </section>


  <section class="container">

    <div
      id="product-detail"
      class="product-detail"
    >

      <p class="loading">
        در حال بارگذاری محصول...
      </p>

    </div>

  </section>

</main>


<footer class="store-footer">

  <div class="container">

    <p>
      © تأسیسات آپادانا - تمامی حقوق محفوظ است.
    </p>

  </div>

</footer>


<script>

const API_BASE = "/api/store";


let currentProduct = null;

let productImages = [];

let currentImageIndex = 0;


/* =========================================================
   ابزارهای عمومی
========================================================= */


function formatPrice(value) {

  const number = Number(value || 0);

  return `${number.toLocaleString("fa-IR")} تومان`;

}


function escapeHtml(value) {

  return String(value ?? "")
    .replace(/&/g, "&amp;")
    .replace(/</g, "&lt;")
    .replace(/>/g, "&gt;")
    .replace(/"/g, "&quot;")
    .replace(/'/g, "&#039;");

}


function getCart() {

  try {

    return JSON.parse(
      localStorage.getItem(
        "tasisat_apadana_cart"
      ) || "[]"
    );

  } catch {

    return [];

  }

}


function saveCart(cart) {

  localStorage.setItem(
    "tasisat_apadana_cart",
    JSON.stringify(cart)
  );

  updateCartCount();

}


function updateCartCount() {

  const element =
    document.getElementById("cart-count");

  if (!element) {
    return;
  }


  const cart = getCart();


  const count = cart.reduce(
    (total, item) =>
      total + Number(item.quantity || 0),
    0
  );


  element.textContent =
    count.toLocaleString("fa-IR");

}


/* =========================================================
   مسیر تصویر
========================================================= */


function getProductImageUrl(image) {

  if (!image) {

    return "/assets/products/placeholder.svg";

  }


  const value =
    String(image).trim();


  if (
    value.startsWith("http://") ||
    value.startsWith("https://") ||
    value.startsWith("data:")
  ) {

    return value;

  }


  if (value.startsWith("/")) {

    return value;

  }


  if (value.startsWith("assets/")) {

    return "/" + value;

  }


  if (value.startsWith("products/")) {

    return "/assets/" + value;

  }


  return "/assets/products/" + value;

}


/* =========================================================
   تصاویر محصول
========================================================= */


function prepareProductImages(product) {

  let images = [];


  if (
    Array.isArray(product.images) &&
    product.images.length > 0
  ) {

    images = product.images
      .map(item => {

        if (
          typeof item === "string"
        ) {

          return item;

        }

        return item.image;

      })
      .filter(Boolean);

  }


  if (
    images.length === 0 &&
    product.image
  ) {

    images = [
      product.image
    ];

  }


  if (images.length === 0) {

    images = [
      "/assets/products/placeholder.svg"
    ];

  }


  return images.map(
    getProductImageUrl
  );

}


/* =========================================================
   نمایش تصویر اصلی
========================================================= */


function showProductImage(index) {

  if (!productImages.length) {
    return;
  }


  if (index < 0) {

    index =
      productImages.length - 1;

  }


  if (
    index >= productImages.length
  ) {

    index = 0;

  }


  currentImageIndex = index;


  const mainImage =
    document.getElementById(
      "product-main-image"
    );


  if (mainImage) {

    mainImage.src =
      productImages[currentImageIndex];

  }


  document
    .querySelectorAll(
      ".product-thumbnail"
    )
    .forEach(
      (thumbnail, thumbnailIndex) => {

        thumbnail.classList.toggle(
          "active",
          thumbnailIndex ===
            currentImageIndex
        );

      }
    );

}


/* =========================================================
   تغییر تصویر
========================================================= */


function previousImage() {

  showProductImage(
    currentImageIndex - 1
  );

}


function nextImage() {

  showProductImage(
    currentImageIndex + 1
  );

}


/* =========================================================
   افزودن به سبد
========================================================= */


function addToCart() {

  if (!currentProduct) {
    return;
  }


  const quantityInput =
    document.getElementById(
      "product-quantity"
    );


  let quantity =
    Number(
      quantityInput?.value || 1
    );


  if (!Number.isInteger(quantity)) {

    quantity = 1;

  }


  quantity =
    Math.max(1, quantity);


  if (
    currentProduct.stock > 0
  ) {

    quantity =
      Math.min(
        quantity,
        Number(currentProduct.stock)
      );

  }


  const cart =
    getCart();


  const existing =
    cart.find(
      item =>
        String(item.id) ===
        String(currentProduct.id)
    );


  if (existing) {

    existing.quantity += quantity;


    if (
      currentProduct.stock > 0
    ) {

      existing.quantity =
        Math.min(
          existing.quantity,
          Number(currentProduct.stock)
        );

    }

  } else {

    cart.push({

      id: currentProduct.id,

      name: currentProduct.name,

      price: currentProduct.price,

      image:
        productImages[0] ||
        getProductImageUrl(
          currentProduct.image
        ),

      quantity

    });

  }


  saveCart(cart);


  alert(
    "محصول به سبد خرید اضافه شد."
  );

}


/* =========================================================
   نمایش جزئیات محصول
========================================================= */


function renderProduct(product) {

  currentProduct =
    product;


  productImages =
    prepareProductImages(product);


  currentImageIndex = 0;


  const container =
    document.getElementById(
      "product-detail"
    );


  const stock =
    Number(product.stock || 0);


  let stockText;


  if (stock > 0) {

    stockText =
      `موجودی: ${stock.toLocaleString("fa-IR")} عدد`;

  } else {

    stockText =
      "در حال حاضر ناموجود";

  }


  container.innerHTML = `

    <div class="product-detail-card">


      <div class="product-detail-media">


        <div class="product-main-image">


          <img
            id="product-main-image"
            class="product-detail-image"
            src="${escapeHtml(
              productImages[0]
            )}"
            alt="${escapeHtml(
              product.name
            )}"
          >


          ${
            productImages.length > 1
              ? `

                <button
                  type="button"
                  class="product-image-arrow product-image-arrow-prev"
                  aria-label="تصویر قبلی"
                  onclick="previousImage()"
                >
                  ‹
                </button>


                <button
                  type="button"
                  class="product-image-arrow product-image-arrow-next"
                  aria-label="تصویر بعدی"
                  onclick="nextImage()"
                >
                  ›
                </button>

              `
              : ""
          }


        </div>


        ${
          productImages.length > 1
            ? `

              <div class="product-thumbnails">

                ${productImages
                  .map(
                    (image, index) => `

                      <button
                        type="button"
                        class="product-thumbnail ${
                          index === 0
                            ? "active"
                            : ""
                        }"
                        onclick="showProductImage(${index})"
                        aria-label="تصویر ${index + 1}"
                      >

                        <img
                          src="${escapeHtml(
                            image
                          )}"
                          alt="${escapeHtml(
                            product.name
                          )}"
                        >

                      </button>

                    `
                  )
                  .join("")}

              </div>

            `
            : ""
        }


      </div>


      <div class="product-detail-content">


        <h1>
          ${escapeHtml(
            product.name ||
            "محصول"
          )}
        </h1>


        <div class="product-detail-price">

          ${formatPrice(
            product.price
          )}

        </div>


        <div class="product-detail-stock">

          ${stockText}

        </div>


        ${
          product.description
            ? `

              <div class="product-description">

                ${escapeHtml(
                  product.description
                )}

              </div>

            `
            : ""
        }


        ${
          stock > 0
            ? `

              <div class="product-actions">

                <label
                  for="product-quantity"
                >
                  تعداد
                </label>


                <input
                  id="product-quantity"
                  type="number"
                  min="1"
                  max="${stock}"
                  value="1"
                >


                <button
                  type="button"
                  class="product-button"
                  onclick="addToCart()"
                >
                  افزودن به سبد خرید
                </button>

              </div>

            `
            : `

              <div class="product-actions">

                <button
                  type="button"
                  class="product-button"
                  disabled
                >
                  محصول ناموجود است
                </button>

              </div>

            `
        }


        <a
          href="index.html"
          class="back-link"
        >
          ← بازگشت به فروشگاه
        </a>


      </div>


    </div>

  `;

}


/* =========================================================
   دریافت محصول
========================================================= */


async function loadProduct() {

  const container =
    document.getElementById(
      "product-detail"
    );


  const slug =
    new URLSearchParams(
      window.location.search
    ).get("slug");


  if (!slug) {

    container.innerHTML = `

      <div class="product-detail-card">

        <div class="product-detail-content">

          <h1>
            محصول پیدا نشد
          </h1>

          <p class="product-description">
            شناسه محصول مشخص نشده است.
          </p>

          <a
            href="index.html"
            class="back-link"
          >
            ← بازگشت به فروشگاه
          </a>

        </div>

      </div>

    `;

    return;

  }


  try {

    const response =
      await fetch(
        `${API_BASE}/products/${encodeURIComponent(slug)}`
      );


    if (!response.ok) {

      throw new Error(
        "PRODUCT_NOT_FOUND"
      );

    }


    const data =
      await response.json();


    if (
      !data ||
      !data.product
    ) {

      throw new Error(
        "PRODUCT_NOT_FOUND"
      );

    }


    renderProduct(
      data.product
    );


  } catch (error) {

    console.error(error);


    container.innerHTML = `

      <div class="product-detail-card">

        <div class="product-detail-content">

          <h1>
            محصول پیدا نشد
          </h1>

          <p class="product-description">
            امکان دریافت اطلاعات این محصول وجود ندارد.
          </p>

          <a
            href="index.html"
            class="back-link"
          >
            ← بازگشت به فروشگاه
          </a>

        </div>

      </div>

    `;

  }

}


/* =========================================================
   شروع صفحه
========================================================= */


document.addEventListener(
  "DOMContentLoaded",
  () => {

    updateCartCount();

    loadProduct();

  }
);

</script>

</body>

</html>
