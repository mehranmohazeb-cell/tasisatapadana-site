<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>پیگیری سفارش | تأسیسات آپادانا</title>
  <meta name="description" content="پیگیری وضعیت سفارش با کد پیگیری و شماره موبایل، بدون نیاز به ثبت‌نام.">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Vazirmatn:wght@400;500;700;900&display=swap">
  <link rel="stylesheet" href="store.css">
</head>
<body>

<header class="store-header">
  <div class="container">
    <a href="index.html" class="logo-link">
      <img src="../assets/logo-header.png" alt="تأسیسات آپادانا">
    </a>
    <nav class="store-nav">
      <a href="index.html">فروشگاه</a>
      <a href="cart.html">سبد خرید <span id="cart-count">0</span></a>
      <a href="track-order.html">پیگیری سفارش</a>
      <a href="account.html">حساب کاربری</a>
      <a href="../support.html">پشتیبانی</a>
    </nav>
  </div>
</header>

<main class="container">

  <section class="order-page-title" style="text-align:center;">
    <h1>پیگیری سفارش</h1>
    <p>کد پیگیری و شماره موبایلی که هنگام ثبت سفارش وارد کرده‌اید را وارد کنید.</p>
  </section>

  <div class="form-card track-form">
    <form id="track-form" novalidate>
      <div class="field-grid">
        <label class="field field-full">
          کد پیگیری
          <input id="tracking_code" name="tracking_code" type="text" placeholder="AP-XXXXXXXXXX" required style="text-transform:uppercase;">
        </label>
        <label class="field field-full">
          شماره موبایل
          <input id="mobile" name="mobile" type="tel" inputmode="numeric" placeholder="09xxxxxxxxx" maxlength="11" required>
        </label>
      </div>
      <div class="form-submit-row">
        <button type="submit" class="product-button" id="track-button">پیگیری سفارش</button>
      </div>
      <div id="track-message" class="form-message"></div>
    </form>
  </div>

  <div id="track-result" class="track-result"></div>

</main>

<footer class="store-footer">
  <div class="container">
    <p>© تأسیسات آپادانا - تمامی حقوق محفوظ است.</p>
  </div>
</footer>

<script src="order-config.js"></script>
<script>
const API_BASE = "/api/store";

function getCart() {
  try { return JSON.parse(localStorage.getItem("tasisat_apadana_cart")) || []; }
  catch { return []; }
}

function updateCartCount() {
  const el = document.getElementById("cart-count");
  if (!el) return;
  el.textContent = getCart().reduce((t, i) => t + Number(i.quantity || 0), 0).toLocaleString("fa-IR");
}

function formatPrice(price) {
  return `${(Number(price) || 0).toLocaleString("fa-IR")} تومان`;
}

function escapeHtml(value) {
  return String(value ?? "")
    .replaceAll("&", "&amp;").replaceAll("<", "&lt;").replaceAll(">", "&gt;")
    .replaceAll('"', "&quot;").replaceAll("'", "&#039;");
}

function formatDate(value) {
  try { return new Date(value).toLocaleString("fa-IR"); }
  catch { return String(value); }
}

function statusBadgeClass(status) {
  if (status === "shipped" || status === "completed") return "is-shipped";
  if (status === "cancelled") return "is-cancelled";
  return "";
}

function showMessage(text, type) {
  const el = document.getElementById("track-message");
  el.textContent = text;
  el.className = `form-message is-visible ${type === "error" ? "is-error" : "is-success"}`;
}

function renderOrder(order) {
  const container = document.getElementById("track-result");

  const itemsHtml = (order.items || []).map((item) => `
    <div class="summary-line">
      <span>${escapeHtml(item.product_name)} × ${Number(item.quantity).toLocaleString("fa-IR")}</span>
      <strong>${formatPrice(item.subtotal ?? item.price * item.quantity)}</strong>
    </div>
  `).join("");

  const timelineHtml = (order.history || []).map((h) => `
    <li>${escapeHtml(h.status_label)}<small>${escapeHtml(formatDate(h.created_at))}</small></li>
  `).join("");

  const postalHtml = order.postal_tracking_code ? `
    <div class="summary-line"><span>شرکت ارسال</span><strong>${escapeHtml(order.postal_carrier || "-")}</strong></div>
    <div class="summary-line"><span>کد مرسوله پستی</span><strong>${escapeHtml(order.postal_tracking_code)}</strong></div>
  ` : "";

  container.innerHTML = `
    <div class="summary-card">
      <div style="display:flex;justify-content:space-between;align-items:center;flex-wrap:wrap;gap:10px;">
        <h2 style="margin:0;">سفارش ${escapeHtml(order.tracking_code)}</h2>
        <span class="status-badge ${statusBadgeClass(order.status)}">${escapeHtml(order.status_label)}</span>
      </div>

      <div class="summary-line"><span>نام گیرنده</span><strong>${escapeHtml(order.customer_name)}</strong></div>
      <div class="summary-line"><span>آدرس</span><strong>${escapeHtml(order.address)}</strong></div>
      <div class="summary-line"><span>تاریخ ثبت</span><strong>${escapeHtml(formatDate(order.created_at))}</strong></div>
      ${postalHtml}
      <div class="summary-total"><span>مبلغ کل</span><strong>${formatPrice(order.total)}</strong></div>

      <h3 style="margin-top:20px;">اقلام سفارش</h3>
      ${itemsHtml}

      <h3 style="margin-top:20px;">روند سفارش</h3>
      <ul class="status-timeline">${timelineHtml}</ul>
    </div>
  `;
}

async function submitTrack(event) {
  event.preventDefault();

  const trackingCode = document.getElementById("tracking_code").value.trim().toUpperCase();
  const mobile = window.normalizeDigits(document.getElementById("mobile").value).trim();

  if (!trackingCode || !window.ORDER_CONFIG.mobilePattern.test(mobile)) {
    showMessage("کد پیگیری و شماره موبایل معتبر را وارد کنید.", "error");
    return;
  }

  const button = document.getElementById("track-button");
  button.disabled = true;
  button.textContent = "در حال جست‌وجو...";

  document.getElementById("track-result").innerHTML = "";
  document.getElementById("track-message").className = "form-message";

  try {
    const response = await fetch(`${API_BASE}/track?tracking_code=${encodeURIComponent(trackingCode)}&mobile=${encodeURIComponent(mobile)}`);
    const data = await response.json();

    if (!response.ok || !data.ok) {
      throw new Error(data.message || "سفارشی با این مشخصات پیدا نشد.");
    }

    renderOrder(data.order);
  } catch (error) {
    showMessage(error.message, "error");
  } finally {
    button.disabled = false;
    button.textContent = "پیگیری سفارش";
  }
}

document.addEventListener("DOMContentLoaded", () => {
  updateCartCount();

  const params = new URLSearchParams(window.location.search);
  const prefillCode = params.get("tracking_code");
  if (prefillCode) {
    document.getElementById("tracking_code").value = prefillCode;
  }

  document.getElementById("track-form").addEventListener("submit", submitTrack);
});
</script>
</body>
</html>
