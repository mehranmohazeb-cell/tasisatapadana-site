<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>سفارش‌های من | تأسیسات آپادانا</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Vazirmatn:wght@400;500;700;900&display=swap">
  <link rel="stylesheet" href="store.css">
</head>
<body>

<header class="store-header">
  <div class="container">
    <a href="index.html" class="logo-link">
      <img src="../assets/logo-header.png" alt="تأسیسات آپادانا">
    </a>

    <nav class="store-nav">
      <a href="index.html">فروشگاه</a>
      <a href="cart.html" class="nav-cart-link"><svg class="nav-icon" viewBox="0 0 24 24" aria-hidden="true" focusable="false"><path fill="currentColor" d="M7 18c-1.1 0-1.99.9-1.99 2S5.9 22 7 22s2-.9 2-2-.9-2-2-2zM1 2v2h2l3.6 7.59-1.35 2.44C4.52 14.37 5 16 6 16h12v-2H6.42c-.14 0-.25-.11-.25-.25l.03-.12L7.1 12h7.45c.75 0 1.41-.41 1.75-1.03l3.58-6.49c.08-.14.12-.31.12-.48 0-.55-.45-1-1-1H5.21l-.94-2H1zm16 18c-1.1 0-1.99.9-1.99 2s.89 2 1.99 2 2-.9 2-2-.9-2-2-2z"/></svg>سبد خرید <span id="cart-count">0</span></a>
      <a href="track-order.html">پیگیری سفارش</a>
      <a href="account.html" class="nav-account-link"><svg class="nav-icon" viewBox="0 0 24 24" aria-hidden="true" focusable="false"><path fill="currentColor" d="M12 12c2.21 0 4-1.79 4-4s-1.79-4-4-4-4 1.79-4 4 1.79 4 4 4zm0 2c-2.67 0-8 1.34-8 4v2h16v-2c0-2.66-5.33-4-8-4z"/></svg>حساب کاربری</a>
      <a href="../support.html">پشتیبانی</a>
    </nav>
  </div>
</header>

<main class="container">

  <section class="order-page-title">
    <h1>سفارش‌های من</h1>
    <p>تاریخچه سفارش‌های ثبت‌شده با این حساب کاربری.</p>
  </section>

  <div id="orders-content">
    <p class="loading">در حال بارگذاری...</p>
  </div>

</main>

<footer class="store-footer">
  <div class="container">
    <p>© تأسیسات آپادانا - تمامی حقوق محفوظ است.</p>
  </div>
</footer>

<script src="order-config.js"></script>

<script>
const API_BASE = "/api/store";


function getCart() {
  try {
    return JSON.parse(
      localStorage.getItem("tasisat_apadana_cart")
    ) || [];
  } catch {
    return [];
  }
}


function updateCartCount() {
  const el = document.getElementById("cart-count");

  if (!el) return;

  el.textContent = getCart()
    .reduce(
      (t, i) => t + Number(i.quantity || 0),
      0
    )
    .toLocaleString("fa-IR");
}


function formatPrice(price) {
  return `${(Number(price) || 0).toLocaleString("fa-IR")} تومان`;
}


function escapeHtml(value) {
  return String(value ?? "")
    .replaceAll("&", "&amp;")
    .replaceAll("<", "&lt;")
    .replaceAll(">", "&gt;")
    .replaceAll('"', "&quot;")
    .replaceAll("'", "&#039;");
}


function formatDate(value) {
  try {
    return new Date(value).toLocaleString("fa-IR");
  } catch {
    return String(value);
  }
}


async function loadOrders() {

  const container =
    document.getElementById("orders-content");


  // بررسی ورود مشتری
  const sessionResponse =
    await fetch(
      `${API_BASE}/customers/me`,
      {
        credentials: "include"
      }
    );


  const sessionData =
    await sessionResponse.json();


  if (!sessionData.logged_in) {

    container.innerHTML = `
      <p>
        برای مشاهده سفارش‌های خود باید ابتدا
        وارد حساب کاربری شوید.
      </p>

      <a
        href="account.html"
        class="product-button"
        style="display:inline-block;width:auto;"
      >
        ورود / ثبت‌نام
      </a>
    `;

    return;
  }


  try {

    // دریافت سفارش‌های مشتری
    const response =
      await fetch(
        `${API_BASE}/customers/orders`,
        {
          credentials: "include"
        }
      );


    const data =
      await response.json();


    if (!response.ok || !data.ok) {
      throw new Error(
        data.message ||
        "دریافت سفارش‌ها با خطا مواجه شد."
      );
    }


    const orders =
      data.orders || [];


    // بدون سفارش
    if (orders.length === 0) {

      container.innerHTML = `
        <p>
          هنوز سفارشی ثبت نکرده‌اید.
        </p>

        <a
          href="index.html"
          class="product-button"
          style="display:inline-block;width:auto;"
        >
          رفتن به فروشگاه
        </a>
      `;

      return;
    }


    // نمایش سفارش‌ها
    container.innerHTML = `
      <div class="my-orders-list">

        ${orders.map((order) => `

          <div class="my-order-card">

            <div class="my-order-card-top">

              <strong>
                ${escapeHtml(order.tracking_code)}
              </strong>

              <span class="status-badge">
                ${escapeHtml(order.status_label)}
              </span>

            </div>


            <div class="my-order-meta">

              ${Number(order.item_count).toLocaleString("fa-IR")}
              قلم کالا
              ·
              ${formatPrice(order.total)}
              ·
              ${escapeHtml(
                formatDate(order.created_at)
              )}

            </div>


            ${
              order.postal_tracking_code
                ? `
                  <div class="my-order-meta">
                    کد مرسوله پستی:
                    ${escapeHtml(
                      order.postal_tracking_code
                    )}
                  </div>
                `
                : ""
            }


            <!-- دکمه‌های سفارش -->

            <div
              style="
                display:flex;
                flex-wrap:wrap;
                gap:8px;
                margin-top:14px;
              "
            >

              <a
                href="invoice.html?order_id=${encodeURIComponent(order.id)}"
                class="product-button"
                style="
                  display:inline-block;
                  width:auto;
                "
              >
                مشاهده فاکتور
              </a>

            </div>

          </div>

        `).join("")}

      </div>
    `;


  } catch (error) {

    container.innerHTML = `
      <p>
        ${escapeHtml(error.message)}
      </p>
    `;

  }
}


document.addEventListener("DOMContentLoaded", () => {

  updateCartCount();

  loadOrders();

});
</script>

</body>
</html>
