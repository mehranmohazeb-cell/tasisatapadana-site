<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>تاریخچه استعلام ارسال | تأسیسات آپادانا</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Vazirmatn:wght@400;500;700;900&display=swap">
  <link rel="stylesheet" href="../../admin-common.css">
  <style>
    .quote-row { display: grid; grid-template-columns: 1fr auto; gap: 12px; align-items: center; padding: 10px 0; border-bottom: 1px solid #e5e9e8; font-size: 13px; }
    .quote-row:last-child { border-bottom: none; }
  </style>
</head>

<body>

  <header class="admin-header">
    <div class="container">
      <h1>مدیریت فروشگاه</h1>
      <a href="../../../store/" class="back-link">بازگشت به فروشگاه</a>
    </div>
  </header>

  <nav class="admin-nav">
    <div class="container" id="admin-nav"></div>
  </nav>

  <main class="container">

    <div id="shipping-sub-nav"></div>

    <section class="admin-card">
      <div class="section-heading">
        <h2>تاریخچه استعلام آنلاین (Audit)</h2>
        <button id="refresh-history" class="secondary-button" type="button">بروزرسانی</button>
      </div>
      <p style="font-size:13px; color:#71817e; margin-top:-8px;">
        این فقط یک گزارش/Cache از استعلام‌های آنلاین است — هیچ‌کدام خودکار به تعرفه دائمی
        (Table Rate) تبدیل نمی‌شوند. تبدیل، در صورت نیاز، همیشه دستی و از طریق Import است.
      </p>
      <div id="history-container">
        <p class="loading">در حال بارگذاری...</p>
      </div>
    </section>

  </main>

  <script src="../../admin-common.js"></script>
  <script src="quote-history.js"></script>
</body>
</html>
