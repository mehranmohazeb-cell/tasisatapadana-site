<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>مدیریت سفارش‌ها | تأسیسات آپادانا</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Vazirmatn:wght@400;500;700;900&display=swap">
  <link rel="stylesheet" href="../admin-common.css">
</head>

<body>

  <header class="admin-header">
    <div class="container">
      <h1>مدیریت فروشگاه</h1>
      <a href="../../store/" class="back-link">بازگشت به فروشگاه</a>
    </div>
  </header>

  <nav class="admin-nav">
    <div class="container" id="admin-nav"></div>
  </nav>

  <main class="container">

    <section class="admin-card">

      <div class="section-heading">
        <h2>سفارش‌ها</h2>
        <button id="refresh-orders" class="secondary-button" type="button">بروزرسانی</button>
      </div>

      <div class="filter-bar">
        <input id="orders-search" type="text" placeholder="جست‌وجو بر اساس کد پیگیری، شماره موبایل یا نام مشتری">
        <select id="orders-status-filter">
          <option value="">همه وضعیت‌ها</option>
          <option value="pending">در حال بررسی</option>
          <option value="confirmed">تأیید شده</option>
          <option value="preparing">در حال آماده‌سازی</option>
          <option value="shipped">ارسال شده</option>
          <option value="completed">تکمیل شده</option>
          <option value="cancelled">لغو شده</option>
        </select>
        <button id="orders-search-button" class="secondary-button" type="button">جست‌وجو</button>
      </div>

      <div id="list-container">
        <p class="loading">در حال بارگذاری سفارش‌ها...</p>
      </div>

      <div id="pagination-container"></div>

    </section>

  </main>

  <div id="modal-root"></div>

  <script src="../admin-common.js"></script>
  <script src="orders.js"></script>
</body>
</html>
