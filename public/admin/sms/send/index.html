<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>ارسال پیامک | تأسیسات آپادانا</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Vazirmatn:wght@400;500;700;900&display=swap">
  <link rel="stylesheet" href="../../admin-common.css">
</head>

<body>

  <header class="admin-header">
    <div class="container">
      <h1>مدیریت فروشگاه</h1>
      <a href="../../../store/" class="back-link">بازگشت به فروشگاه</a>
    </div>
  </header>

  <nav class="admin-nav">
    <div class="container" id="admin-nav"></div>
  </nav>

  <main class="container">

    <div id="sms-sub-nav"></div>

    <section class="admin-card">
      <h2>ارسال پیامک دستی</h2>

      <form id="send-form">

        <div class="form-grid">

          <div class="form-group">
            <label for="send-mobile">شماره موبایل</label>
            <input id="send-mobile" type="tel" inputmode="numeric" placeholder="09xxxxxxxxx" maxlength="11" required>
          </div>

          <div class="form-group">
            <label for="send-template">قالب پیامک</label>
            <select id="send-template" required>
              <option value="">در حال بارگذاری قالب‌ها...</option>
            </select>
          </div>

          <div class="form-group full" id="send-variables-container" style="display:none;">
            <label>متغیرهای قالب</label>
            <div id="send-variables-fields"></div>
          </div>

          <div class="form-group full" id="send-preview-container" style="display:none;">
            <label>پیش‌نمایش</label>
            <div id="send-preview-text" style="background:#f5f8f7; border:1px solid #dbe3e1; border-radius:8px; padding:12px; font-size:13px; color:#355653;"></div>
          </div>

        </div>

        <div class="form-actions">
          <button type="button" id="preview-button" class="secondary-button">پیش‌نمایش</button>
          <button type="submit" class="primary-button">ارسال پیامک</button>
        </div>

        <div id="send-message"></div>

      </form>
    </section>

  </main>

  <script src="../../admin-common.js"></script>
  <script src="send.js"></script>
</body>
</html>
