<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>مدیریت دسته‌بندی | تأسیسات آپادانا</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Vazirmatn:wght@400;500;700;900&display=swap">
  <link rel="stylesheet" href="../admin-common.css">
  <link rel="stylesheet" href="categories.css">
</head>

<body>

  <header class="admin-header">
    <div class="container">
      <h1>مدیریت فروشگاه</h1>
      <a href="../../store/" class="back-link">بازگشت به فروشگاه</a>
    </div>
  </header>

  <nav class="admin-nav">
    <div class="container" id="admin-nav"></div>
  </nav>

  <main class="container">

    <!-- ===== پرچم‌های نمایش عمومی ===== -->

    <section class="admin-card">
      <div class="section-heading">
        <h2>نمایش عمومی قابلیت‌های جدید</h2>
      </div>
      <p class="site-status-note" style="margin-top:0;">
        این قابلیت‌ها آماده و قابل‌مدیریت هستند اما تا وقتی هرکدام را روشن نکنید،
        هیچ‌چیز جدیدی برای مشتریان فروشگاه نمایش داده نمی‌شود.
      </p>
      <div class="site-status-row" id="feature-flags-row">
        <p class="loading">در حال بارگذاری...</p>
      </div>
    </section>

    <!-- ===== فرم افزودن/ویرایش دسته ===== -->

    <section class="admin-card">
      <h2 id="category-form-title">افزودن دسته</h2>

      <form id="category-form">
        <input type="hidden" id="category-id">

        <div class="form-grid">
          <div class="form-group">
            <label for="category-name">نام دسته</label>
            <input id="category-name" type="text" required placeholder="مثلاً: پکیج">
          </div>

          <div class="form-group">
            <label for="category-slug">شناسه (Slug)</label>
            <input id="category-slug" type="text" placeholder="در صورت خالی‌بودن، خودکار ساخته می‌شود">
          </div>

          <div class="form-group">
            <label for="category-parent">دسته والد</label>
            <select id="category-parent">
              <option value="">— بدون والد (دسته اصلی) —</option>
            </select>
          </div>

          <div class="form-group">
            <label for="category-sort-order">ترتیب نمایش</label>
            <input id="category-sort-order" type="number" value="0">
          </div>

          <div class="form-group checkbox-group">
            <label>
              <input id="category-active" type="checkbox" checked>
              دسته فعال باشد
            </label>
          </div>
        </div>

        <div class="form-actions">
          <button type="submit" class="primary-button">ذخیره دسته</button>
          <button type="button" id="cancel-category-edit" class="secondary-button">لغو / پاک کردن فرم</button>
        </div>
      </form>
    </section>

    <!-- ===== لیست دسته‌ها ===== -->

    <section class="admin-card">
      <div class="section-heading">
        <h2>دسته‌های موجود</h2>
        <button id="refresh-categories" class="secondary-button" type="button">بروزرسانی</button>
      </div>

      <div id="categories-list">
        <p class="loading">در حال بارگذاری دسته‌ها...</p>
      </div>
    </section>

  </main>

  <!-- ===== Modal حذف با انتقال ===== -->
  <div class="modal-overlay" id="delete-modal" style="display:none;">
    <div class="modal-box">
      <button type="button" class="modal-close" id="delete-modal-close">بستن</button>
      <h3 class="modal-title">حذف دسته</h3>
      <p id="delete-modal-message"></p>
      <div class="form-group">
        <label for="delete-modal-target">انتقال محصولات/زیردسته‌ها به:</label>
        <select id="delete-modal-target"></select>
      </div>
      <div class="form-actions">
        <button type="button" class="danger-button" id="delete-modal-confirm">انتقال و حذف</button>
        <button type="button" class="secondary-button" id="delete-modal-cancel">انصراف</button>
      </div>
    </div>
  </div>

  <script src="../admin-common.js"></script>
  <script src="categories.js"></script>
</body>
</html>
