<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>داشبورد مدیریت | تأسیسات آپادانا</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Vazirmatn:wght@400;500;700;900&display=swap">
  <link rel="stylesheet" href="admin-common.css">
</head>

<body>

  <header class="admin-header">
    <div class="container">
      <h1>مدیریت فروشگاه</h1>
      <a href="../store/" class="back-link">بازگشت به فروشگاه</a>
    </div>
  </header>

  <nav class="admin-nav">
    <div class="container" id="admin-nav"></div>
  </nav>

  <main class="container">

    <div id="alerts-bar" class="alerts-bar"></div>

    <section class="admin-card">
      <div class="section-heading">
        <h2>محصولات</h2>
        <button id="refresh-summary" class="secondary-button" type="button">بروزرسانی</button>
      </div>
      <div class="stat-grid" id="products-stats">
        <p class="loading">در حال بارگذاری...</p>
      </div>
    </section>

    <section class="admin-card">
      <h2>سفارش‌ها</h2>
      <div class="stat-grid" id="orders-stats">
        <p class="loading">در حال بارگذاری...</p>
      </div>
    </section>

    <section class="admin-card">
      <h2>پشتیبانی</h2>
      <div class="stat-grid" id="tickets-stats">
        <p class="loading">در حال بارگذاری...</p>
      </div>
    </section>

  </main>

  <script src="admin-common.js"></script>
  <script src="dashboard.js"></script>
</body>
</html>
